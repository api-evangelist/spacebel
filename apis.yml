description: Spacebel s.a. is a Belgian software company building flight and ground software for space missions,
  including on-board software for ESA missions and Earth-observation ground segments, catalogues and data-access
  services. Its GIS estate serves Sentinel-derived Earth-observation products through OGC-standard web services.
